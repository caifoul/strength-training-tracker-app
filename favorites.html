<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Favorites – Constantia</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
    <style>body { visibility: hidden; }</style>
    <script type="module" src="auth-guard.js"></script>
    <link rel="icon" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="manifest" href="manifest.json" />
</head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="header-top">
          <div>
            <h1>Favorites</h1>
            <p>Your starred workouts. Use them in Coach or Notebook.</p>
          </div>
          <nav class="nav-links">
            <a href="home.html">Dashboard</a>
            <a href="index.html">Log Workout</a>
            <a href="coach.html">Coach</a>
            <a href="sg-workout.html">Notebook</a>
            <a href="favorites.html">Favorites</a>
            <a href="profile.html">Profile</a>
          </nav>
        </div>
      </header>

      <section class="log-card">
        <div class="log-header">
          <h2>Saved Workouts</h2>
          <button id="clear-favorites" class="secondary-button">Remove All</button>
        </div>
        <div id="favorites-list" class="workout-list">
          <p class="empty-state">No saved workouts yet. Log a session on the Log Workout page and star it to save it here.</p>
        </div>
      </section>
    </main>

    <script type="module" src="favorites.js"></script>
  </body>
</html>
